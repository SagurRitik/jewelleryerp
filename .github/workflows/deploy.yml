name: Deploy JewelryERP

# ============================================================================
#  DEVELOPMENT deployment pipeline  (DEV ONLY)  —  DISABLED ON PUSH
# ----------------------------------------------------------------------------
#  Target : DEVELOPMENT server (devjewelerp.nazaradiamonds.com)
#
#  *** THE DEV SERVER NOW DEPLOYS ITSELF. THIS WORKFLOW NO LONGER RUNS ON
#  *** PUSH. Pushing to `dev` is still all a developer has to do.
#
#  Why: this job deploys by SSH-ing INTO the dev box, and that can never work
#  for this particular server. The dev machine is on a private LAN
#  (192.168.1.100) behind NAT on a dynamic ISP address, and the only public
#  name it has — devjewelerp.nazaradiamonds.com — resolves to Cloudflare proxy
#  IPs, which serve HTTP through a Cloudflare Tunnel and do not carry SSH. A
#  GitHub-hosted runner therefore has no reachable, stable address to connect
#  to: `Accepted publickey` has never appeared once in the server's auth logs,
#  so this job has failed on every single dev push since it was written.
#
#  Replaced by a PULL-based deployer that runs on the dev box itself:
#      script : /var/www/html/jewelleryerp/scripts/dev-autodeploy.sh
#      timer  : jewelleryerp-dev-deploy.timer  (polls origin/dev every 60s)
#      log    : /var/log/jewelleryerp-deploy.log
#  It needs no inbound port, no static IP and no SSH key stored in GitHub, so
#  it cannot break the way this job did.
#
#  The job below is KEPT, unchanged, behind `workflow_dispatch` only. If the
#  dev box ever gets a reachable static address, set SERVER_HOST and run it
#  manually from the Actions tab to confirm before restoring the push trigger.
#
#  PRODUCTION is untouched: deploy-production.yml still triggers on `main` and
#  deploys to 52.27.144.75, which is a genuinely reachable public host.
# ============================================================================

on:
  # No `push:` trigger on purpose — see the note above. The dev server pulls.
  workflow_dispatch:   # manual-only re-deploy from the Actions tab

# Least privilege: deployment happens over SSH, so the workflow token only
# needs read access to the repository. Nothing here writes back to GitHub.
permissions:
  contents: read

jobs:
  deploy-development:
    # Second, independent guard: run ONLY when the pushed ref is exactly dev.
    if: github.ref == 'refs/heads/dev'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Binding to the `development` Environment makes every `secrets.*` below
    # resolve to that environment first. The `||` fallbacks let this work with
    # the older repo-level secret names too, so the pipeline runs whichever
    # naming the repo currently has configured.
    environment: development

    # Stop two overlapping dev deploys from racing on the same server.
    concurrency:
      group: deploy-development
      cancel-in-progress: false

    steps:
      - name: Deploy to Development Server
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_BRANCH: dev   # hard-coded: this job only ever deploys dev
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/html/jewelleryerp' }}
          BACKEND_ENV_B64: ${{ secrets.BACKEND_ENV_B64 }}
        with:
          host: ${{ secrets.SERVER_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USERNAME }}
          port: ${{ secrets.SERVER_PORT || secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_BRANCH,DEPLOY_PATH,BACKEND_ENV_B64
          script_stop: true
          script: |
            # Fail the whole deploy on the FIRST error.
            set -eo pipefail
            trap 'echo "::error::[DEV] Deployment FAILED (exit code $?)"; exit 1' ERR

            echo "==== [DEV] Deployment started: $(date -u) ===="
            echo "Branch : $DEPLOY_BRANCH"
            echo "Path   : $DEPLOY_PATH"

            echo "[1/8] Go to project directory"
            cd "$DEPLOY_PATH"

            echo "[2/8] Load Node & NVM environment"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            # Resolve pm2 wherever it lives: global install, repo-local, or npx.
            if command -v pm2 >/dev/null 2>&1; then
              PM2="pm2"
            elif [ -x "$DEPLOY_PATH/node_modules/.bin/pm2" ]; then
              PM2="$DEPLOY_PATH/node_modules/.bin/pm2"
            else
              PM2="npx --yes pm2"
            fi
            echo "      node: $(node -v)  pm2: $PM2"

            echo "[3/8] Fetch & hard-reset to origin/$DEPLOY_BRANCH"
            git fetch origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            # Optional: recreate backend/.env from the environment secret.
            # No-op if BACKEND_ENV_B64 is not set (server keeps its own .env).
            if [ -n "${BACKEND_ENV_B64:-}" ]; then
              echo "[3b/8] Writing backend/.env from secret"
              echo "$BACKEND_ENV_B64" | base64 -d > backend/.env
            fi

            echo "[4/8] Backend dependencies"
            cd backend
            npm install --omit=dev

            echo "[5/8] Frontend dependencies"
            cd ../frontend
            npm install

            echo "[6/8] Build frontend"
            NODE_OPTIONS=--max-old-space-size=4096 npm run build

            echo "[7/8] Restart backend via PM2"
            cd ../backend
            $PM2 restart jewellery-backend --update-env \
              || $PM2 start server.js --name jewellery-backend --update-env

            echo "[8/8] Persist PM2 process list"
            $PM2 save
            $PM2 list

            echo "==== [DEV] Deployment finished successfully: $(date -u) ===="
