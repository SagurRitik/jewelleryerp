<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="luxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1525"/>
      <stop offset="50%" stop-color="#1B0C16"/>
      <stop offset="100%" stop-color="#0F060D"/>
    </linearGradient>
    <radialGradient id="gemGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E8C5D8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6B3151" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0F060D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="gemFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="16" fill="url(#luxBg)"/>
  <circle cx="200" cy="180" r="140" fill="url(#gemGlow)"/>

  <!-- Outer Ring Accent -->
  <circle cx="200" cy="170" r="95" stroke="url(#goldStroke)" stroke-width="1" stroke-dasharray="3 6" fill="none" opacity="0.4"/>

  <!-- Faceted Diamond Vector -->
  <g transform="translate(140, 110)">
    <!-- Top Crown Polygons -->
    <polygon points="30,10 90,10 120,40 0,40" fill="url(#gemFacet)" stroke="url(#goldStroke)" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="30,10 60,40 0,40" fill="url(#gemFacet)" stroke="url(#goldStroke)" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="90,10 60,40 120,40" fill="url(#gemFacet)" stroke="url(#goldStroke)" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="30,10 60,10 60,40" fill="url(#gemFacet)" stroke="url(#goldStroke)" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="60,10 90,10 60,40" fill="url(#gemFacet)" stroke="url(#goldStroke)" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Pavilion Bottom Lines -->
    <polygon points="0,40 60,110 120,40" fill="url(#gemFacet)" stroke="url(#goldStroke)" stroke-width="2" stroke-linejoin="round"/>
    <line x1="0" y1="40" x2="60" y2="110" stroke="url(#goldStroke)" stroke-width="1.5"/>
    <line x1="30" y1="40" x2="60" y2="110" stroke="url(#goldStroke)" stroke-width="1.5"/>
    <line x1="60" y1="40" x2="60" y2="110" stroke="url(#goldStroke)" stroke-width="1.5"/>
    <line x1="90" y1="40" x2="60" y2="110" stroke="url(#goldStroke)" stroke-width="1.5"/>
    <line x1="120" y1="40" x2="60" y2="110" stroke="url(#goldStroke)" stroke-width="1.5"/>
  </g>

  <!-- Premium Typography -->
  <text x="200" y="275" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="14" font-weight="600" fill="#EAD5CE" letter-spacing="3" opacity="0.9">FINE JEWELLERY</text>
  <text x="200" y="298" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#B38B9F" letter-spacing="1.5" opacity="0.75">IMAGE NOT AVAILABLE</text>
</svg>

